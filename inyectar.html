<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inyector de Cintillo</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #f8fafc; display: flex; justify-content: center; padding-top: 50px; color: #334155; }
        .card { background: white; padding: 2rem; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); width: 100%; max-width: 450px; }
        h2 { margin: 0 0 1.5rem 0; font-size: 1.25rem; text-align: center; }

        .zone { border: 2px dashed #cbd5e1; border-radius: 12px; padding: 1.5rem; text-align: center; cursor: pointer; transition: 0.2s; margin-bottom: 1rem; }
        .zone:hover { border-color: #3b82f6; background: #f1f5f9; }
        .zone.active { border-color: #22c55e; border-style: solid; background: #f0fdf4; }
        .zone.disabled { opacity: 0.4; cursor: not-allowed; }

        .icon { font-size: 2rem; display: block; margin-bottom: 0.5rem; }
        button { width: 100%; padding: 0.8rem; background: #3b82f6; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 1rem; }
        button:disabled { background: #94a3b8; }
        #preview { max-width: 100%; margin-top: 10px; display: none; border-radius: 4px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Cintillo Automático</h2>

    <div class="zone" id="z1" onclick="document.getElementById('i1').click()" ondrop="drop(event, 'png')" ondragover="event.preventDefault()">
        <span class="icon">🖼️</span>
        <span id="t1">Seleccionar o soltar <b>PNG</b></span>
        <input type="file" id="i1" hidden accept="image/png" onchange="file(this.files, 'png')">
        <img id="preview">
    </div>

    <div class="zone disabled" id="z2" onclick="document.getElementById('i2').click()" ondrop="drop(event, 'html')" ondragover="event.preventDefault()">
        <span class="icon">📄</span>
        <span id="t2">Seleccionar o soltar <b>HTML</b></span>
        <input type="file" id="i2" hidden accept=".html" onchange="file(this.files, 'html')">
    </div>

    <button id="btn" disabled onclick="run()">🚀 Procesar y Descargar</button>
</div>

<script>
    let png, html, name;
    function drop(e, t) { e.preventDefault(); file(e.dataTransfer.files, t); }
    function file(f, t) {
        if(!f.length) return;
        let r = new FileReader();
        r.onload = (e) => {
            if(t == 'png') {
                png = e.target.result;
                document.getElementById('preview').src = png;
                document.getElementById('preview').style.display = 'block';
                document.getElementById('z1').classList.add('active');
                document.getElementById('z2').classList.remove('disabled');
            } else {
                html = e.target.result;
                name = f[0].name;
                document.getElementById('z2').classList.add('active');
                document.getElementById('btn').disabled = false;
            }
        };
        t == 'png' ? r.readAsDataURL(f[0]) : r.readAsText(f[0]);
    }
    function run() {
        let blob = new Blob([html.replace(/<body[^>]*>/, (m) => `${m}\n<img src="${png}" style="width:100%">`)], {type: 'text/html'});
        let a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = name.replace('.html', '_cintillo.html');
        a.click();
    }
</script>
</body>
</html>
