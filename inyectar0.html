<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inyector de Cintillo Profesional</title>
    <style>
        :root { --color-primary: #102e52; --color-disabled: #e0e6ed; --color-accent: #c9a86a; }
        body { font-family: 'Segoe UI', sans-serif; background: #f5f7fa; padding: 40px; display: flex; justify-content: center; }
        .tool-container { width: 100%; max-width: 700px; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: var(--color-primary); text-align: center; }

        .drop-zone {
            border: 2px dashed var(--color-disabled);
            padding: 40px;
            text-align: center;
            cursor: pointer;
            margin: 20px 0;
            transition: all 0.3s ease;
            border-radius: 8px;
        }
        .drop-zone:hover { border-color: var(--color-primary); background: #f9fbff; }
        .drop-zone.drag-over { border-color: var(--color-primary); background: #f0f7ff; }

        .disabled { opacity: 0.5; pointer-events: none; border-color: #ccc; }
        .btn-action {
            width: 100%; padding: 15px; background: var(--color-primary); color: white;
            border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 1rem;
        }
        .btn-action:disabled { background: var(--color-disabled); cursor: not-allowed; }

        #cintilloPreview { max-width: 100%; height: auto; margin-top: 15px; border: 1px solid #ddd; display: none; }
    </style>
</head>
<body>

<div class="tool-container">
    <h2>Inyector de Cintillo</h2>

    <div id="zone1" class="drop-zone"
         onclick="document.getElementById('pngInput').click()"
         ondrop="handleDrop(event, 'png')"
         ondragover="handleDragOver(event)"
         ondragleave="handleDragLeave(event)">
        <p>Paso 1: Arrastra aquí o <b>haz clic</b> para seleccionar el <b>PNG</b></p>
        <input type="file" id="pngInput" hidden accept="image/png" onchange="handleFiles(this.files, 'png')">
        <img id="cintilloPreview" src="">
    </div>

    <div id="zone2" class="drop-zone disabled"
         onclick="document.getElementById('htmlInput').click()"
         ondrop="handleDrop(event, 'html')"
         ondragover="handleDragOver(event)"
         ondragleave="handleDragLeave(event)">
        <p>Paso 2: Arrastra aquí o <b>haz clic</b> para seleccionar el <b>HTML</b></p>
        <input type="file" id="htmlInput" hidden accept=".html" onchange="handleFiles(this.files, 'html')">
    </div>

    <button id="btnProcesar" class="btn-action" disabled onclick="procesar()">Procesar y Descargar</button>
</div>

<script>
    let pngBase64 = null, htmlContent = null, htmlName = "";

    // Evitar que el navegador abra el archivo al soltarlo
    function handleDragOver(e) {
        e.preventDefault();
        e.currentTarget.classList.add('drag-over');
    }

    function handleDragLeave(e) {
        e.currentTarget.classList.remove('drag-over');
    }

    function handleDrop(e, type) {
        e.preventDefault();
        e.stopPropagation(); // Evita propagación extra
        e.currentTarget.classList.remove('drag-over');
        handleFiles(e.dataTransfer.files, type);
    }

    function handleFiles(files, type) {
        if (!files.length) return;
        const file = files[0];
        const reader = new FileReader();

        reader.onload = (e) => {
            if (type === 'png') {
                pngBase64 = e.target.result;
                const img = document.getElementById('cintilloPreview');
                img.src = pngBase64;
                img.style.display = 'block';
                document.getElementById('zone2').classList.remove('disabled');
            } else {
                htmlContent = e.target.result;
                htmlName = file.name;
                document.getElementById('btnProcesar').disabled = false;
            }
        };
        type === 'png' ? reader.readAsDataURL(file) : reader.readAsText(file);
    }

    function procesar() {
        if (!pngBase64 || !htmlContent) return;

        const tag = `<img src="${pngBase64}" style="width:100%; display:block;">`;
        const nuevoHtml = htmlContent.replace(/<body[^>]*>/, (match) => `${match}\n${tag}`);

        const blob = new Blob([nuevoHtml], {type: 'text/html'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = htmlName.replace('.html', '') + '_cintillo.html';
        a.click();
    }
</script>
</body>
</html>
