<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cancionero Digital Interactivo v4</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                        heading: ['Cinzel', 'serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .song-verse-block {
            white-space: pre-wrap;
            word-break: break-word;
        }
        .acorde {
            font-weight: bold;
            color: #b45309;
        }
        .dark .acorde {
            color: #f59e0b;
        }
        @media print {
            header, aside, #mobile-drawer-toggle, #export-toolbar { display: none !important; }
            main { overflow: visible !important; padding: 0 !important; background: white !important; color: black !important; }
            #active-song-card { box-shadow: none !important; border: none !important; padding: 0 !important; }
        }
    </style>
</head>
<body class="bg-amber-50/30 text-slate-800 dark:bg-slate-950 dark:text-slate-100 min-h-screen flex flex-col font-sans relative">
    <header class="sticky top-0 z-30 bg-amber-900 text-amber-50 shadow-md">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <button id="mobile-drawer-toggle" class="md:hidden p-2 rounded-lg bg-amber-800 hover:bg-amber-700 transition focus:outline-none" title="Abrir/Cerrar Menú">
                    <span class="text-lg">☰</span>
                </button>
                <span class="text-xl">🎵</span>
                <h1 class="font-heading font-bold text-base sm:text-xl tracking-wide truncate">Cancionero Digital <span class="text-xs bg-amber-800 px-2 py-0.5 rounded border border-amber-700/50">v4</span></h1>
            </div>

            <div class="flex items-center space-x-1 sm:space-x-2">
                <button id="btn-sort-alpha" class="px-2 py-1 text-xs font-semibold rounded bg-amber-800 hover:bg-amber-700 transition border border-amber-700/50 flex items-center space-x-1" title="Ordenar cantos alfabéticamente">
                    <span>🔤</span>
                    <span id="sort-order-label" class="hidden sm:inline">A-Z</span>
                </button>

                <div class="flex items-center bg-amber-800 rounded-lg p-1 border border-amber-700/50">
                    <button id="btn-zoom-out" class="px-2 py-0.5 text-xs font-bold rounded hover:bg-amber-700 transition" title="Reducir texto">A-</button>
                    <span id="font-size-indicator" class="px-1 sm:px-2 text-[10px] sm:text-xs font-mono text-amber-200">100%</span>
                    <button id="btn-zoom-in" class="px-2 py-0.5 text-xs font-bold rounded hover:bg-amber-700 transition" title="Aumentar texto">A+</button>
                </div>

                <button id="theme-toggle" class="p-2 rounded-lg bg-amber-800 hover:bg-amber-700 transition" title="Cambiar tema Día/Noche">
                    <span>🌓</span>
                </button>

                <button id="fullscreen-toggle" class="p-2 rounded-lg bg-amber-800 hover:bg-amber-700 transition hidden sm:block" title="Maximizar">
                    <span>⛶</span>
                </button>
            </div>
        </div>
    </header>

    <div id="sidebar-backdrop" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-40 hidden md:hidden transition-opacity"></div>

    <div class="flex-1 max-w-7xl w-full mx-auto flex overflow-hidden relative">
        <aside id="sidebar" class="fixed md:static inset-y-0 left-0 z-50 w-80 sm:w-96 bg-white dark:bg-slate-900 border-r border-amber-200/60 dark:border-slate-800 flex flex-col transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out shadow-xl md:shadow-none">
            <div class="p-4 border-b border-amber-100 dark:border-slate-800 space-y-3">
                <div class="flex items-center justify-between md:hidden">
                    <span class="font-heading font-bold text-sm text-amber-900 dark:text-amber-200">Menú de Cantos</span>
                    <button id="close-drawer-btn" class="p-1 rounded text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 text-lg">✕</button>
                </div>
                <div class="relative">
                    <input type="text" id="search-input" placeholder="Buscar canto o letra..." class="w-full px-3 py-2 bg-amber-50/50 dark:bg-slate-800 border border-amber-200 dark:border-slate-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
                </div>
                <div class="text-xs text-amber-800 dark:text-amber-400 font-medium" id="total-songs-count">Cargando...</div>
            </div>

            <div id="index-container" class="flex-1 overflow-y-auto p-3 space-y-2"></div>
        </aside>

        <main class="flex-1 bg-amber-50/10 dark:bg-slate-950 overflow-y-auto p-4 sm:p-6 md:p-10 w-full">
            <div id="welcome-state" class="h-full flex flex-col items-center justify-center text-center py-20">
                <span class="text-5xl mb-4">📖</span>
                <h2 class="font-heading text-2xl font-bold text-amber-950 dark:text-amber-100">Selecciona un canto</h2>
                <p class="text-slate-500 text-sm mt-2">Usa el menú para explorar el repertorio por secciones.</p>
            </div>

            <div id="active-song-wrapper" class="hidden max-w-2xl mx-auto space-y-4">
                <div id="export-toolbar" class="flex flex-wrap items-center justify-between gap-2 bg-white dark:bg-slate-900 p-3 rounded-xl border border-amber-200/60 dark:border-slate-800 shadow-sm">
                    <span class="text-xs font-semibold text-slate-500 dark:text-slate-400">Exportar / Compartir:</span>
                    <div class="flex items-center space-x-1 sm:space-x-2">
                        <button id="btn-export-html" class="px-2.5 py-1.5 text-xs bg-amber-100 dark:bg-slate-800 hover:bg-amber-200 text-amber-900 dark:text-amber-300 rounded-lg transition font-medium">📄 HTML</button>
                        <button id="btn-export-png" class="px-2.5 py-1.5 text-xs bg-amber-100 dark:bg-slate-800 hover:bg-amber-200 text-amber-900 dark:text-amber-300 rounded-lg transition font-medium">🖼️ PNG</button>
                        <button id="btn-export-pdf" class="px-2.5 py-1.5 text-xs bg-amber-100 dark:bg-slate-800 hover:bg-amber-200 text-amber-900 dark:text-amber-300 rounded-lg transition font-medium">🖨️ PDF</button>
                        <button id="btn-share" class="px-2.5 py-1.5 text-xs bg-amber-800 hover:bg-amber-700 text-amber-50 rounded-lg transition font-medium">🔗 Compartir</button>
                    </div>
                </div>

                <article id="active-song-card" class="bg-white dark:bg-slate-900 p-5 sm:p-8 rounded-2xl border border-amber-200/60 dark:border-slate-800 shadow-sm space-y-6">
                    <div class="border-b border-amber-200 dark:border-slate-800 pb-4">
                        <span id="song-section" class="px-3 py-1 bg-amber-100 dark:bg-amber-900/40 text-amber-800 dark:text-amber-300 text-xs font-semibold uppercase rounded-full"></span>
                        <h2 id="song-title" class="font-serif text-2xl sm:text-3xl font-bold text-amber-950 dark:text-amber-100 mt-3"></h2>
                        <div id="song-tone-box" class="mt-2 text-sm font-semibold text-amber-700 dark:text-amber-400 hidden">
                            Tono: <span id="song-tone"></span>
                        </div>
                    </div>
                    <div id="song-verses" class="song-verse-block font-serif text-base sm:text-lg leading-relaxed text-slate-800 dark:text-slate-200 space-y-4 transition-all duration-150"></div>
                </article>
            </div>
        </main>
    </div>

    <script>
        function decodeBase64Utf8(b64Str) {
            try {
                const binary = atob(b64Str);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) {
                    bytes[i] = binary.charCodeAt(i);
                }
                return new TextDecoder("utf-8").decode(bytes);
            } catch (e) {
                return decodeURIComponent(escape(atob(b64Str)));
            }
        }

        function formatearTextoAcordes(texto) {
            if (!texto) return '';
            const htmlEscaped = texto
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");

            // Expresión regular corregida sin conflictos de escape
            return htmlEscaped.replace(/\[([A-Za-z0-9#\+]+)\]/g, '<span class="acorde">$1</span>');
        }

        function initApp() {
            try {
                const sidebar = document.getElementById('sidebar');
                const sidebarBackdrop = document.getElementById('sidebar-backdrop');
                const mobileDrawerToggle = document.getElementById('mobile-drawer-toggle');
                const closeDrawerBtn = document.getElementById('close-drawer-btn');

                const indexContainer = document.getElementById('index-container');
                const searchInput = document.getElementById('search-input');
                const totalSongsCount = document.getElementById('total-songs-count');
                const welcomeState = document.getElementById('welcome-state');
                const activeSongWrapper = document.getElementById('active-song-wrapper');
                const songTitle = document.getElementById('song-title');
                const songSection = document.getElementById('song-section');
                const songTone = document.getElementById('song-tone');
                const songToneBox = document.getElementById('song-tone-box');
                const songVerses = document.getElementById('song-verses');
                const btnSortAlpha = document.getElementById('btn-sort-alpha');
                const sortOrderLabel = document.getElementById('sort-order-label');

                let currentZoom = 100;
                let currentSong = null;
                let sortAscending = true;

                function toggleSidebar(show) {
                    const isOpen = show !== undefined ? show : sidebar.classList.contains('-translate-x-full');
                    if (isOpen) {
                        sidebar.classList.remove('-translate-x-full');
                        sidebarBackdrop.classList.remove('hidden');
                    } else {
                        sidebar.classList.add('-translate-x-full');
                        sidebarBackdrop.classList.add('hidden');
                    }
                }

                if (mobileDrawerToggle) mobileDrawerToggle.onclick = function() { toggleSidebar(); };
                if (closeDrawerBtn) closeDrawerBtn.onclick = function() { toggleSidebar(false); };
                if (sidebarBackdrop) sidebarBackdrop.onclick = function() { toggleSidebar(false); };

                function applyZoom() {
                    if (songVerses) {
                        songVerses.style.fontSize = (currentZoom / 100 * 1.125) + 'rem';
                        document.getElementById('font-size-indicator').textContent = currentZoom + '%';
                    }
                }

                function renderIndex(query) {
                    query = query || '';
                    indexContainer.innerHTML = '';
                    let count = 0;
                    const cleanQuery = query.trim().toLowerCase();
                    const isSearching = cleanQuery.length > 0;

                    SONG_SECTIONS.forEach(function(sec, idx) {
                        let filtered = SONGS_RAW.filter(function(s) {
                            return s.section === sec &&
                            (s.title.toLowerCase().indexOf(cleanQuery) !== -1 || s.lyrics.toLowerCase().indexOf(cleanQuery) !== -1);
                        });

                        if (filtered.length === 0) return;
                        count += filtered.length;

                        filtered.sort(function(a, b) {
                            const res = a.title.localeCompare(b.title, 'es');
                            return sortAscending ? res : -res;
                        });

                        const accordion = document.createElement('div');
                        accordion.className = 'border border-amber-200/60 dark:border-slate-800 rounded-xl overflow-hidden bg-amber-50/20 dark:bg-slate-900/50';

                        const header = document.createElement('button');
                        header.className = 'w-full px-3 py-2.5 flex items-center justify-between text-left font-heading text-xs font-bold text-amber-950 dark:text-amber-200 uppercase bg-amber-100/40 dark:bg-slate-800/60 hover:bg-amber-100/80 transition';

                        header.innerHTML = '<div class="flex items-center space-x-2"><span class="arrow transition-transform duration-200 inline-block font-mono">▶</span><span>' + sec + '</span></div><span class="text-[10px] bg-amber-200/60 dark:bg-slate-700 px-2 py-0.5 rounded-full text-amber-900 dark:text-amber-200 font-sans">' + filtered.length + '</span>';

                        const body = document.createElement('div');
                        body.className = 'p-1.5 space-y-1 hidden';

                        if (isSearching || idx === 0) {
                            body.classList.remove('hidden');
                            const arrow = header.querySelector('.arrow');
                            if (arrow) arrow.style.transform = 'rotate(90deg)';
                        }

                        header.onclick = function() {
                            const isHidden = body.classList.toggle('hidden');
                            const arrow = header.querySelector('.arrow');
                            if (arrow) {
                                arrow.style.transform = isHidden ? 'rotate(0deg)' : 'rotate(90deg)';
                            }
                        };

                        filtered.forEach(function(song) {
                            const btn = document.createElement('button');
                            btn.className = 'w-full text-left px-3 py-1.5 text-xs rounded-lg hover:bg-amber-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-300 truncate transition block';
                            btn.textContent = song.title;
                            btn.onclick = function() {
                                showSong(song);
                                if (window.innerWidth < 768) {
                                    toggleSidebar(false);
                                }
                            };
                            body.appendChild(btn);
                        });

                        accordion.appendChild(header);
                        accordion.appendChild(body);
                        indexContainer.appendChild(accordion);
                    });

                    totalSongsCount.textContent = count + ' cantos/oraciones encontrados';
                }

                function showSong(song) {
                    currentSong = song;
                    welcomeState.classList.add('hidden');
                    activeSongWrapper.classList.remove('hidden');
                    songTitle.textContent = song.title;
                    songSection.textContent = song.section;

                    songVerses.innerHTML = '';
                    const stanzas = song.lyrics.split(/\n\s*\n/);
                    stanzas.forEach(function(stanza) {
                        const p = document.createElement('p');
                        p.className = 'mb-4';
                        p.innerHTML = formatearTextoAcordes(stanza);
                        songVerses.appendChild(p);
                    });

                    if (song.tone) {
                        songTone.textContent = song.tone;
                        songToneBox.classList.remove('hidden');
                    } else {
                        songToneBox.classList.add('hidden');
                    }
                }

                btnSortAlpha.onclick = function() {
                    sortAscending = !sortAscending;
                    if (sortOrderLabel) sortOrderLabel.textContent = sortAscending ? 'A-Z' : 'Z-A';
                    renderIndex(searchInput.value);
                };

                document.getElementById('btn-export-html').onclick = function() {
                    if (!currentSong) return;
                    const standaloneHtml = '<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>' + currentSong.title + '</title><style>body { font-family: sans-serif; padding: 2rem; background: #fffbeb; color: #1e293b; max-width: 650px; margin: 0 auto; } .tag { background: #fef3c7; color: #92400e; padding: 0.2rem 0.6rem; border-radius: 1rem; font-size: 0.8rem; font-weight: bold; text-transform: uppercase; } h1 { color: #451a03; margin-top: 0.8rem; } .tone { color: #b45309; font-weight: bold; margin-bottom: 1rem; } .lyrics { white-space: pre-wrap; font-size: 1.1rem; line-height: 1.6; } .acorde { color: #b45309; font-weight: bold; }</style></head><body><span class="tag">' + currentSong.section + '</span><h1>' + currentSong.title + '</h1>' + (currentSong.tone ? '<div class="tone">Tono: ' + currentSong.tone + '</div>' : '') + '<div class="lyrics">' + formatearTextoAcordes(currentSong.lyrics) + '</div></body></html>';

                    const blob = new Blob([standaloneHtml], { type: 'text/html' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = currentSong.title.replace(/[^a-z0-9]/gi, '_').toLowerCase() + '.html';
                    a.click();
                    URL.revokeObjectURL(url);
                };

                document.getElementById('btn-export-png').onclick = function() {
                    if (!currentSong) return;
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');

                    const padding = 40;
                    const width = 800;
                    const lines = currentSong.lyrics.split('\n');
                    const lineHeight = 28;

                    canvas.width = width;
                    canvas.height = padding * 2 + 100 + (lines.length * lineHeight);

                    ctx.fillStyle = "#ffffff";
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    ctx.fillStyle = "#451a03";
                    ctx.font = "bold 24px Georgia, serif";
                    ctx.fillText(currentSong.title, padding, padding + 30);

                    ctx.fillStyle = "#b45309";
                    ctx.font = "bold 14px sans-serif";
                    const metaText = 'Sección: ' + currentSong.section + (currentSong.tone ? ' | Tono: ' + currentSong.tone : '');
                    ctx.fillText(metaText, padding, padding + 60);

                    ctx.strokeStyle = "#fde68a";
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(padding, padding + 75);
                    ctx.lineTo(width - padding, padding + 75);
                    ctx.stroke();

                    ctx.fillStyle = "#1e293b";
                    ctx.font = "16px Georgia, serif";
                    let y = padding + 110;
                    lines.forEach(function(line) {
                        ctx.fillText(line, padding, y);
                        y += lineHeight;
                    });

                    const a = document.createElement('a');
                    a.href = canvas.toDataURL('image/png');
                    a.download = currentSong.title.replace(/[^a-z0-9]/gi, '_').toLowerCase() + '.png';
                    a.click();
                };

                document.getElementById('btn-export-pdf').onclick = function() { window.print(); };

                document.getElementById('btn-share').onclick = function() {
                    if (!currentSong) return;
                    const textToShare = currentSong.title + '\nSección: ' + currentSong.section + (currentSong.tone ? '\nTono: ' + currentSong.tone : '') + '\n\n' + currentSong.lyrics;

                    if (navigator.share) {
                        navigator.share({ title: currentSong.title, text: textToShare }).catch(function(){});
                    } else {
                        navigator.clipboard.writeText(textToShare).then(function() {
                            alert("Texto copiado al portapapeles.");
                        });
                    }
                };

                document.getElementById('btn-zoom-in').onclick = function() {
                    if (currentZoom < 180) { currentZoom += 10; applyZoom(); }
                };

                document.getElementById('btn-zoom-out').onclick = function() {
                    if (currentZoom > 70) { currentZoom -= 10; applyZoom(); }
                };

                document.getElementById('theme-toggle').onclick = function() {
                    document.documentElement.classList.toggle('dark');
                };

                const fsBtn = document.getElementById('fullscreen-toggle');
                if (fsBtn) {
                    fsBtn.onclick = function() {
                        if (!document.fullscreenElement) {
                            document.documentElement.requestFullscreen().catch(function(){});
                        } else if (document.exitFullscreen) {
                            document.exitFullscreen();
                        }
                    };
                }

                searchInput.oninput = function(e) { renderIndex(e.target.value); };

                renderIndex();

            } catch (err) {
                console.error(err);
                document.getElementById('total-songs-count').textContent = 'Error al cargar los cantos.';
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initApp);
        } else {
            initApp();
        }
    </script>
</body>
</html>
